/* header: navy-to-blue gradient with the Brooklyn Bridge photo as the main visual. The photo fades in by pure CSS (no JS needed) */

.band{position:relative;z-index:0;isolation:isolate;height:660px;overflow:hidden;color:#fff;text-align:center;background:linear-gradient(180deg,var(--b00,#050a1f) 0%,var(--b45) 45%,var(--b80) 80%,var(--field) 100%)}
