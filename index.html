<style>
:root{--navy:#050a1f;--blue:#2f5bff;--blue2:#9fb6ff;--ink:#0b1020;--muted:#667085;--line:#eceff5;--paper:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:#f7f8fc}
body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--ink);background:#f7f8fc;min-height:100vh;overflow-x:hidden;line-height:1.5}
/* header: navy-to-blue gradient with the Brooklyn Bridge photo as the main visual. The photo fades in by pure CSS (no JS needed) */
/* header: navy at top, electric blue glow in the middle, fading to soft white */
.band{position:relative;z-index:0;isolation:isolate;height:660px;overflow:hidden;color:#fff;text-align:center;background:linear-gradient(180deg,#050a1f 0%,#0b1a5c 45%,#2f5bff 80%,#f7f8fc 100%)}
/* bridge crop: photo bottom sits near the bottom of the header so the two stone arches are centered behind the name */
.bridge{position:absolute;z-index:0;left:-6%;width:112%;height:640px;bottom:150px;will-change:transform}
.bridge img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 100%;opacity:.92;-webkit-animation:bridgeIn 2.5s ease-out .15s both;animation:bridgeIn 2.5s ease-out .15s both}
@-webkit-keyframes bridgeIn{from{opacity:0}to{opacity:.92}}
@keyframes bridgeIn{from{opacity:0}to{opacity:.92}}
.tint{position:absolute;z-index:1;top:0;right:0;bottom:0;left:0;pointer-events:none;background:linear-gradient(180deg,rgba(5,10,31,.85) 0%,rgba(8,18,60,.35) 16%,rgba(20,40,140,.12) 34%,rgba(30,64,230,.18) 55%,rgba(47,91,255,.38) 70%,rgba(247,248,252,.85) 86%,#f7f8fc 100%)}
.shade{position:absolute;z-index:1;pointer-events:none;left:50%;top:250px;width:440px;height:200px;margin:-100px 0 0 -220px;border-radius:50%;background:radial-gradient(closest-side,rgba(5,10,31,.45),rgba(5,10,31,.18) 60%,transparent)}
.glow{position:absolute;z-index:1;pointer-events:none;left:50%;top:68%;width:760px;height:380px;margin:-190px 0 0 -380px;border-radius:50%;background:radial-gradient(closest-side,rgba(60,100,255,.35),rgba(47,91,255,.1) 60%,transparent);filter:blur(10px);animation:pulse 9s ease-in-out infinite;will-change:transform,opacity}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.12);opacity:1}}
.inner{position:relative;z-index:2;padding:170px 20px 0;will-change:transform}
.pill{display:inline-block;padding:7px 14px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.14em;color:#e8edff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
h1{margin-top:14px;font-size:46px;font-weight:700;letter-spacing:-.03em;line-height:1.02;text-shadow:0 2px 6px rgba(5,10,31,.6),0 2px 28px rgba(5,10,31,.7)}
.sub{margin-top:10px;font-size:20px;font-weight:500;color:#c9d6ff;letter-spacing:-.01em;text-shadow:0 1px 4px rgba(5,10,31,.7),0 2px 20px rgba(5,10,31,.6)}
main{position:relative;z-index:1;max-width:460px;margin:-150px auto 0;padding:0 16px 40px;display:grid;gap:14px}
.card{background:var(--paper);border-radius:20px;box-shadow:0 20px 50px rgba(15,30,90,.14),0 2px 6px rgba(15,30,90,.06);padding:20px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:68px;border-radius:14px;background:#f2f5ff;color:var(--ink);text-decoration:none;font-size:13px;font-weight:700;letter-spacing:-.005em;transition:background .2s}
.btn svg{width:20px;height:20px;color:var(--blue)}
.btn:active,.btn:hover{background:#e3e9ff}
.save{display:block;margin-top:12px;padding:16px;border-radius:14px;background:var(--blue);color:#fff;text-align:center;text-decoration:none;font-size:17px;font-weight:700;letter-spacing:-.01em;box-shadow:0 10px 24px rgba(47,91,255,.35)}
.save:active,.save:hover{background:#2148e0}
.row{display:flex;gap:14px;align-items:flex-start;padding:13px 2px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:15px}
.row:first-child{padding-top:2px}.row:last-child{border-bottom:0;padding-bottom:2px}
/* subway station-sign labels: white text on a black strip with a thin white rule near the top */
.row small{display:block;color:#6b7280;font-size:12px;font-weight:600;letter-spacing:.04em;margin-bottom:2px;line-height:1.3}
.lines{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;align-items:center;font-size:12px;color:var(--muted)}
.lines b{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;font-size:12px;font-weight:700;color:#fff;letter-spacing:0}
.lines .g{background:#00933c}.lines .l{background:#a7a9ac}.lines .y{background:#fccc0a;color:#000}
.row svg{flex:0 0 20px;width:20px;height:20px;margin-top:22px;color:var(--blue)}
.listings{display:block;text-align:center;padding:16px;color:var(--blue);text-decoration:none;font-weight:700;letter-spacing:-.01em;font-size:15px}
.photo{position:relative;padding:0;overflow:hidden;margin:0}
/* pill sits on the bottom of the headshot over a soft dark scrim */
.photo::after{content:"";position:absolute;left:0;right:0;bottom:0;height:30%;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(5,10,31,.6))}
/* small monogram tucked in the top corner of the headshot */
.photo .mark{position:absolute;z-index:1;top:14px;left:14px;width:36px;height:auto;opacity:.8;filter:drop-shadow(0 1px 6px rgba(5,10,31,.6))}
.photo .pill{position:absolute;z-index:1;left:50%;bottom:14px;transform:translateX(-50%);white-space:nowrap;font-size:10px;padding:6px 12px;background:rgba(5,10,31,.45)}.photo picture img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;object-position:60% 15%;background:#1a2550}
footer{text-align:center;color:var(--muted);font-size:11px;margin-top:6px}
/* mobile: no monogram, name sits closer to a smaller headshot, Save contact visible on first screen */
@media (max-width:600px){

main{margin-top:-466px}

@media (max-width:600px) and (max-height:720px){

@media (prefers-reduced-motion:reduce){.glow{-webkit-animation:none;animation:none}.bridge img{-webkit-animation:none;animation:none;opacity:.92}.bridge,.inner{transform:none!important}}

<script>
(function(){
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce) return;
  var els=[].slice.call(document.querySelectorAll('[data-depth]'));
  var sy=0,tx=0,ty=0,cx=0,cy=0,ticking=false;
  function render(){
    ticking=false;
    cx+=(tx-cx)*0.08; cy+=(ty-cy)*0.08;
    for(var i=0;i<els.length;i++){
      var d=parseFloat(els[i].getAttribute('data-depth'));
      els[i].style.transform='translate3d('+(cx*d*40).toFixed(2)+'px,'+(sy*d+cy*d*30).toFixed(2)+'px,0)';
    }
    if(Math.abs(tx-cx)>0.001||Math.abs(ty-cy)>0.001) req();
  }
  function req(){ if(!ticking){ticking=true;requestAnimationFrame(render);} }
  window.addEventListener('scroll',function(){ sy=Math.min(window.scrollY,600); req(); },{passive:true});
  function pointer(x,y){ tx=(x/window.innerWidth-0.5)*2; ty=(y/window.innerHeight-0.5)*2; req(); }
  window.addEventListener('pointermove',function(e){ pointer(e.clientX,e.clientY); },{passive:true});
  window.addEventListener('touchmove',function(e){ var t=e.touches[0]; if(t) pointer(t.clientX,t.clientY); },{passive:true});
  // Tilt only where no permission prompt is needed (Android, most browsers). iPhone uses touch instead.
  if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission !== 'function'){
    window.addEventListener('deviceorientation',function(e){
      if(e.gamma==null) return;
      tx=Math.max(-1,Math.min(1,e.gamma/30)); ty=Math.max(-1,Math.min(1,(e.beta-45)/30)); req();
    },{passive:true});
  }
})();
